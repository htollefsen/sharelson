<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <rect width="1024" height="1024" rx="180" fill="#208AEF"/>
    <g transform="translate(-61.440000000000055 -61.440000000000055) scale(1.12)">
    <!-- photo card -->
    <rect x="262" y="332" width="500" height="400" rx="60" fill="#FFFFFF"/>
    <!-- picture area inset from the card so a white frame shows on every side -->
    <clipPath id="picture"><rect x="296" y="366" width="432" height="332" rx="36"/></clipPath>
    <g clip-path="url(#picture)">
     <g transform="translate(512 556) scale(1.16) translate(-512 -545)">
      <!-- dog: floppy ears -->
      <ellipse cx="398" cy="540" rx="48" ry="100" transform="rotate(18 398 540)" fill="#208AEF"/>
      <ellipse cx="626" cy="540" rx="48" ry="100" transform="rotate(-18 626 540)" fill="#208AEF"/>
      <!-- head -->
      <ellipse cx="512" cy="545" rx="118" ry="112" fill="#208AEF"/>
      <!-- muzzle -->
      <ellipse cx="512" cy="600" rx="64" ry="46" fill="#FFFFFF"/>
      <!-- nose -->
      <ellipse cx="512" cy="582" rx="24" ry="17" fill="#208AEF"/>
      <!-- mouth -->
      <path d="M512 598 L512 616 M512 616 Q490 636 470 618 M512 616 Q534 636 554 618" stroke="#208AEF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- eyes -->
      <circle cx="466" cy="520" r="16" fill="#FFFFFF"/>
      <circle cx="558" cy="520" r="16" fill="#FFFFFF"/>
      <circle cx="470" cy="522" r="8" fill="#208AEF"/>
      <circle cx="562" cy="522" r="8" fill="#208AEF"/>
     </g>
    </g>
    <!-- upload badge overlapping the card's top-left corner -->
    <circle cx="300" cy="330" r="150" fill="#208AEF"/>
    <circle cx="300" cy="330" r="118" fill="#FFFFFF"/>
    <!-- up arrow -->
    <path d="M300 250 L370 320 L328 320 L328 410 L272 410 L272 320 L230 320 Z" fill="#208AEF"/>
  </g>
  </svg>